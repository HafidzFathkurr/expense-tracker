<!doctype html>
<html lang="id">
  <head>
    <!-- Pengaturan dasar halaman -->
    <meta charset="UTF-8" />
    <!-- viewport membuat halaman responsif di HP -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker - Catatan Keuangan Harian</title>

    <!-- Menghubungkan file CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- ===== HEADER ===== -->
      <header class="header">
        <h1>💰 Expense Tracker</h1>
        <p>Catat pemasukan dan pengeluaran harianmu</p>
      </header>

      <!-- ===== RINGKASAN KEUANGAN ===== -->
      <section class="summary">
        <div class="card card-balance">
          <span class="card-label">Total Saldo</span>
          <strong class="card-value" id="balance">Rp 0</strong>
        </div>
        <div class="card card-income">
          <span class="card-label">Pemasukan</span>
          <strong class="card-value" id="total-income">Rp 0</strong>
        </div>
        <div class="card card-expense">
          <span class="card-label">Pengeluaran</span>
          <strong class="card-value" id="total-expense">Rp 0</strong>
        </div>
      </section>

      <!-- ===== FORM TRANSAKSI ===== -->
      <section class="panel">
        <h2>Tambah Transaksi</h2>

        <form id="transaction-form">
          <!-- Jenis: pemasukan atau pengeluaran -->
          <div class="form-group">
            <label for="type">Jenis</label>
            <select id="type">
              <option value="income">Pemasukan</option>
              <option value="expense">Pengeluaran</option>
            </select>
          </div>

          <!-- Deskripsi transaksi -->
          <div class="form-group">
            <label for="description">Deskripsi</label>
            <input
              type="text"
              id="description"
              placeholder="Contoh: Makan siang"
            />
          </div>

          <!-- Nominal uang -->
          <div class="form-group">
            <label for="amount">Nominal (Rp)</label>
            <input
              type="number"
              id="amount"
              placeholder="Contoh: 25000"
              min="0"
            />
          </div>

          <!-- Kategori -->
          <div class="form-group">
            <label for="category">Kategori</label>
            <select id="category">
              <option value="Gaji">Gaji</option>
              <option value="Makanan">Makanan</option>
              <option value="Transportasi">Transportasi</option>
              <option value="Belanja">Belanja</option>
              <option value="Hiburan">Hiburan</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>

          <!-- Tanggal -->
          <div class="form-group">
            <label for="date">Tanggal</label>
            <input type="date" id="date" />
          </div>

          <button type="submit" class="btn btn-primary">
            Simpan Transaksi
          </button>
        </form>
      </section>

      <!-- ===== RIWAYAT TRANSAKSI ===== -->
      <section class="panel">
        <div class="panel-header">
          <h2>Riwayat Transaksi</h2>

          <!-- Filter kategori -->
          <select id="filter-category" class="filter">
            <option value="all">Semua Kategori</option>
            <option value="Gaji">Gaji</option>
            <option value="Makanan">Makanan</option>
            <option value="Transportasi">Transportasi</option>
            <option value="Belanja">Belanja</option>
            <option value="Hiburan">Hiburan</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>

        <!-- Daftar transaksi. Sementara berisi contoh statis. -->
        <ul id="transaction-list" class="transaction-list">
          <li class="transaction income">
            <div class="transaction-info">
              <strong>Gaji Bulanan</strong>
              <small>Gaji • 01 Nov 2026</small>
            </div>
            <span class="transaction-amount">+ Rp 3.000.000</span>
            <div class="transaction-actions">
              <button class="btn btn-small">Edit</button>
              <button class="btn btn-small btn-danger">Hapus</button>
            </div>
          </li>

          <li class="transaction expense">
            <div class="transaction-info">
              <strong>Makan Siang</strong>
              <small>Makanan • 02 Nov 2026</small>
            </div>
            <span class="transaction-amount">- Rp 25.000</span>
            <div class="transaction-actions">
              <button class="btn btn-small">Edit</button>
              <button class="btn btn-small btn-danger">Hapus</button>
            </div>
          </li>
        </ul>
      </section>
    </div>

    <!-- Menghubungkan file JavaScript (di paling bawah agar HTML dimuat dulu) -->
    <script src="script.js"></script>
  </body>
</html>
